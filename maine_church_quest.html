<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maine Church Quest</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #111827;
    color: #f8fafc;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
    overflow: hidden;
  }
  #wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at center, #26364b 0%, #111827 75%);
  }
  canvas {
    width: min(1100px, 100vw);
    height: min(700px, 100vh);
    image-rendering: pixelated;
    border: 3px solid #475569;
    box-shadow: 0 12px 45px rgba(0,0,0,.55);
    background: #6fa35c;
  }
  #help {
    position: fixed;
    left: 50%;
    bottom: 12px;
    transform: translateX(-50%);
    font-size: 13px;
    color: #cbd5e1;
    opacity: .9;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="1100" height="700"></canvas></div>
<div id="help">WASD / Arrow Keys: move &nbsp; • &nbsp; E / Space: enter, talk, attack &nbsp; • &nbsp; R: restart after defeat</div>

<script>
(() => {
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width, H = canvas.height;
const keys = {};
let justPressed = new Set();

window.addEventListener("keydown", e => {
  if (!keys[e.key.toLowerCase()]) justPressed.add(e.key.toLowerCase());
  keys[e.key.toLowerCase()] = true;
  if (["arrowup","arrowdown","arrowleft","arrowright"," ","w","a","s","d","e","r"].includes(e.key.toLowerCase()))
    e.preventDefault();
});
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

function pressed(...names) {
  return names.some(n => justPressed.has(n));
}

function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function rectContains(r,x,y){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }

const world = {
  x: 0, y: 0, w: 1800, h: 1200
};

// Historical figures used in the adventure.
// The homes are intentionally fictional game locations rather than claims about
// exact surviving residences.
const people = [
  {
    id: 1,
    name: "Rev. Samuel Moody",
    town: "York",
    year: 1700,
    home: {x: 250,y:180,w:180,h:130},
    color: "#c98b5b",
    text: [
      "Welcome, traveler. I am Samuel Moody.",
      "I became minister at York in 1700.",
      "York's early congregation was one of the",
      "oldest established churches in what became Maine.",
      "Remember that early New England churches",
      "were closely tied to the communities around them."
    ]
  },
  {
    id: 2,
    name: "Rev. Jeremiah Wise",
    town: "Berwick",
    year: 1707,
    home: {x:760,y:260,w:180,h:130},
    color: "#b97850",
    text: [
      "Greetings. I am Jeremiah Wise.",
      "I was settled in Berwick in 1707.",
      "The early churches of Maine grew alongside",
      "small settlements, farms, mills, and rivers.",
      "A minister often traveled great distances",
      "to serve scattered families."
    ]
  },
  {
    id: 3,
    name: "Rev. John Newmarch",
    town: "Kittery",
    year: 1714,
    home: {x:1270,y:170,w:180,h:130},
    color: "#a96d4b",
    text: [
      "Peace be with you. I am John Newmarch.",
      "In 1714 I became pastor when the Kittery",
      "church was formally organized.",
      "The congregation had 43 petitioners who",
      "signed a covenant and confession of faith.",
      "My ministry there lasted for decades."
    ]
  }
];

const boss = {
  name: "Rev. Kenneth Phelps",
  title: "Mapleton Baptist Church — 1995",
  // The historical source says Phelps served about 30 years and retired in 2015,
  // making him the pastor during 1995. The battle itself is fictional.
  maxHp: 100,
  hp: 100,
  x: 900,
  y: 620,
  speed: 115,
  attackCooldown: 0,
  shootCooldown: 0,
  hitFlash: 0
};

const player = {
  x: 90, y: 850, r: 16, speed: 190,
  hp: 100, maxHp: 100,
  dirX: 1, dirY: 0,
  attackCooldown: 0,
  attackTimer: 0,
  invuln: 0
};

let camera = {x:0,y:0};
let state = "world"; // world, dialog, bossIntro, boss, victory, defeat
let currentPerson = null;
let dialogLines = [];
let dialogIndex = 0;
let visited = [];
let message = "Explore Maine and visit the three historic homes.";
let messageTimer = 4;
let projectiles = [];
let particles = [];
let enemyProjectiles = [];
let shake = 0;

function resetGame(){
  player.x=90; player.y=850; player.hp=100;
  boss.hp=boss.maxHp; boss.x=900; boss.y=620;
  visited=[]; currentPerson=null; dialogLines=[]; dialogIndex=0;
  state="world"; projectiles=[]; enemyProjectiles=[]; particles=[];
  message="Explore Maine and visit the three historic homes."; messageTimer=4;
}

function worldRectToScreen(r){
  return {x:r.x-camera.x,y:r.y-camera.y,w:r.w,h:r.h};
}

function addParticle(x,y,color="#fff",life=.5,size=4){
  particles.push({x,y,color,life,max:life,size,dx:(Math.random()-.5)*100,dy:(Math.random()-.5)*100});
}

function drawText(text,x,y,size=18,color="#fff",align="left"){
  ctx.font=`${size}px system-ui, sans-serif`;
  ctx.fillStyle=color;
  ctx.textAlign=align;
  ctx.textBaseline="middle";
  ctx.fillText(text,x,y);
}

function roundedRect(x,y,w,h,r,fill,stroke=null){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  ctx.fillStyle=fill; ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();}
}

function drawWorld(){
  // grass
  ctx.fillStyle="#6fa35c"; ctx.fillRect(0,0,W,H);

  // subtle terrain patches
  for(let y=0;y<world.h;y+=90){
    for(let x=0;x<world.w;x+=90){
      const n=Math.sin(x*.03+y*.05)*.5+.5;
      ctx.fillStyle = n>.55 ? "#73a960" : "#6a9d58";
      ctx.fillRect(x-camera.x,y-camera.y,90,90);
    }
  }

  // roads
  const roads=[
    {x:0,y:520,w:1800,h:95},
    {x:530,y:0,w:90,h:1200},
    {x:1100,y:0,w:90,h:1200}
  ];
  roads.forEach(r=>{
    const s=worldRectToScreen(r);
    ctx.fillStyle="#b9a77e"; ctx.fillRect(s.x,s.y,s.w,s.h);
    ctx.strokeStyle="#d7c89d"; ctx.lineWidth=3;
    for(let i=-100;i<s.w+100;i+=60) {
      ctx.beginPath(); ctx.moveTo(s.x+i,s.y+s.h/2); ctx.lineTo(s.x+i+30,s.y+s.h/2);
      ctx.stroke();
    }
  });

  // water
  ctx.fillStyle="#4d8fb0";
  ctx.fillRect(0-camera.x,1040-camera.y,world.w,160);
  for(let x=0;x<world.w;x+=70){
    ctx.strokeStyle="rgba(255,255,255,.18)";
    ctx.beginPath();
    ctx.moveTo(x-camera.x,1080-camera.y);
    ctx.quadraticCurveTo(x+20-camera.x,1068-camera.y,x+40-camera.x,1080-camera.y);
    ctx.stroke();
  }

  // town labels
  drawText("YORK • 1700",340-camera.x,120-camera.y,20,"#20301c","center");
  drawText("BERWICK • 1707",850-camera.x,200-camera.y,20,"#20301c","center");
  drawText("KITTERY • 1714",1360-camera.x,110-camera.y,20,"#20301c","center");

  people.forEach(p=>{
    const r=worldRectToScreen(p.home);
    // house
    ctx.fillStyle=p.color;
    ctx.fillRect(r.x,r.y+35,r.w,r.h-35);
    ctx.fillStyle="#6b3f2a";
    ctx.beginPath();
    ctx.moveTo(r.x-12,r.y+38); ctx.lineTo(r.x+r.w/2,r.y-15); ctx.lineTo(r.x+r.w+12,r.y+38); ctx.closePath(); ctx.fill();
    ctx.fillStyle="#4b3025"; ctx.fillRect(r.x+r.w*.42,r.y+r.h-55,30,55);
    ctx.fillStyle="#9bd0dc"; ctx.fillRect(r.x+25,r.y+60,35,28); ctx.fillRect(r.x+r.w-60,r.y+60,35,28);

    if(!visited.includes(p.id)){
      drawText("VISIT",r.x+r.w/2,r.y-32,14,"#fff","center");
    } else {
      drawText("VISITED",r.x+r.w/2,r.y-32,14,"#d1fae5","center");
    }
  });

  // church markers
  const churches=[
    {x:340,y:690,name:"Old York Church"},
    {x:850,y:760,name:"Berwick Meetinghouse"},
    {x:1360,y:690,name:"Kittery Church"}
  ];
  churches.forEach(c=>{
    ctx.fillStyle="#e5e7eb";
    ctx.fillRect(c.x-28-camera.x,c.y-45-camera.y,56,70);
    ctx.fillStyle="#d1d5db";
    ctx.beginPath();
    ctx.moveTo(c.x-38-camera.x,c.y-45-camera.y);
    ctx.lineTo(c.x-camera.x,c.y-85-camera.y);
    ctx.lineTo(c.x+38-camera.x,c.y-45-camera.y);
    ctx.closePath();ctx.fill();
    ctx.fillStyle="#7f1d1d";
    ctx.fillRect(c.x-4-camera.x,c.y-84-camera.y,8,25);
    ctx.fillRect(c.x-11-camera.x,c.y-76-camera.y,22,7);
  });

  // player
  drawPlayer(player.x-camera.x,player.y-camera.y);
}

function drawPlayer(x,y){
  ctx.save();
  ctx.translate(x,y);
  // shadow
  ctx.fillStyle="rgba(0,0,0,.25)";
  ctx.beginPath();ctx.ellipse(0,13,19,8,0,0,Math.PI*2);ctx.fill();
  // body
  ctx.fillStyle="#2563eb";ctx.fillRect(-13,-2,26,24);
  ctx.fillStyle="#f2c7a5";ctx.beginPath();ctx.arc(0,-14,11,0,Math.PI*2);ctx.fill();
  // direction
  ctx.fillStyle="#111827";ctx.beginPath();ctx.arc(player.dirX*6, -14+player.dirY*6,2.5,0,Math.PI*2);ctx.fill();
  ctx.restore();
}

function drawHUD(){
  roundedRect(15,15,390,105,12,"rgba(15,23,42,.86)","#64748b");
  drawText("MAINE CHURCH QUEST",30,37,20,"#fde68a");
  drawText(`Homes visited: ${visited.length} / 3`,30,66,16,"#fff");
  drawText(`Health: ${Math.max(0,Math.ceil(player.hp))}`,30,91,16,player.hp<30?"#fca5a5":"#bbf7d0");

  if(messageTimer>0 && state==="world"){
    roundedRect(W/2-330,H-75,660,45,10,"rgba(15,23,42,.9)");
    drawText(message,W/2,H-52,16,"#fff","center");
  }

  if(state==="boss"){
    roundedRect(W/2-260,15,520,80,12,"rgba(20,20,30,.92)","#ef4444");
    drawText("BOSS: REV. KENNETH PHELPS — 1995",W/2,39,18,"#fecaca","center");
    ctx.fillStyle="#450a0a";ctx.fillRect(W/2-220,58,440,15);
    ctx.fillStyle="#ef4444";ctx.fillRect(W/2-220,58,440*Math.max(0,boss.hp/boss.maxHp),15);
    drawText(`${Math.ceil(boss.hp)} HP`,W/2,84,13,"#fff","center");
  }
}

function drawDialog(){
  ctx.fillStyle="rgba(0,0,0,.48)";ctx.fillRect(0,0,W,H);
  roundedRect(100,H-230,W-200,175,16,"#172033","#94a3b8");
  const p=currentPerson;
  drawText(p.name,135,H-195,25,"#fde68a");
  drawText(`${p.town} • ${p.year}`,135,H-166,15,"#cbd5e1");
  const line=dialogLines[dialogIndex] || "";
  drawText(line,135,H-125,18,"#fff");
  drawText("E / SPACE  →  continue",W-135,H-90,14,"#a7f3d0","right");
}

function drawBossIntro(){
  ctx.fillStyle="rgba(0,0,0,.72)";ctx.fillRect(0,0,W,H);
  roundedRect(150,130,W-300,430,18,"#171923","#ef4444");
  drawText("THE THIRD HOME IS BEHIND YOU.",W/2,185,27,"#fecaca","center");
  drawText("A FIGURE APPROACHES FROM MAPLETON.",W/2,230,19,"#fff","center");
  drawText("REV. KENNETH PHELPS",W/2,300,34,"#fca5a5","center");
  drawText("Pastor of Mapleton Baptist Church in 1995",W/2,340,18,"#cbd5e1","center");
  drawText("The historical identity is real; this boss battle is fictional.",W/2,395,15,"#94a3b8","center");
  drawText("Press E / SPACE to begin the battle",W/2,480,18,"#fde68a","center");
}

function drawBoss(){
  // battle arena
  ctx.fillStyle="#29313a";ctx.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=80) for(let y=0;y<H;y+=80){
    ctx.strokeStyle="rgba(255,255,255,.04)";ctx.strokeRect(x,y,80,80);
  }
  drawText("MAPLETON — 1995",W/2,110,24,"#e2e8f0","center");

  // boss
  ctx.save();ctx.translate(boss.x,boss.y);
  ctx.fillStyle="rgba(0,0,0,.3)";ctx.beginPath();ctx.ellipse(0,28,34,11,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#7f1d1d";ctx.fillRect(-23,-10,46,45);
  ctx.fillStyle="#e8b58e";ctx.beginPath();ctx.arc(0,-25,18,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#111827";ctx.fillRect(-14,-43,28,7);
  ctx.fillStyle="#fef3c7";ctx.fillRect(25,-4,10,30); // book
  ctx.restore();

  // player
  drawPlayer(player.x,player.y);

  enemyProjectiles.forEach(p=>{
    ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();
  });

  projectiles.forEach(p=>{
    ctx.fillStyle="#93c5fd";ctx.beginPath();ctx.arc(p.x,p.y,6,0,Math.PI*2);ctx.fill();
  });

  drawHUD();
  drawText("Move: WASD / arrows   •   Attack: E / SPACE",W/2,H-25,15,"#cbd5e1","center");
}

function drawEnd(victory){
  ctx.fillStyle="rgba(0,0,0,.78)";ctx.fillRect(0,0,W,H);
  roundedRect(180,150,W-360,350,18,victory?"#10251c":"#291313",victory?"#4ade80":"#ef4444");
  drawText(victory?"VICTORY!":"DEFEATED",W/2,225,42,victory?"#86efac":"#fca5a5","center");
  drawText(victory?"You completed the Maine Church Quest.":"The 1995 Mapleton pastor wins this round.",W/2,285,19,"#fff","center");
  drawText(victory?"Three historic figures visited • Boss defeated":"Press R to restart the adventure.",W/2,335,17,"#cbd5e1","center");
  if(victory) drawText("Press R to play again.",W/2,405,18,"#fde68a","center");
}

function openHome(p){
  currentPerson=p;
  dialogLines=p.text;
  dialogIndex=0;
  state="dialog";
}

function closeDialog(){
  if(dialogIndex < dialogLines.length-1){
    dialogIndex++;
  } else {
    if(!visited.includes(currentPerson.id)) visited.push(currentPerson.id);
    message=`You learned about ${currentPerson.name}.`;
    messageTimer=3;
    state="world";
    if(visited.length===3){
      setTimeout(()=>{ state="bossIntro"; },250);
    }
  }
}

function movePlayer(dt){
  let dx=(keys["arrowright"]||keys["d"]?1:0)-(keys["arrowleft"]||keys["a"]?1:0);
  let dy=(keys["arrowdown"]||keys["s"]?1:0)-(keys["arrowup"]||keys["w"]?1:0);
  if(dx||dy){
    const len=Math.hypot(dx,dy);dx/=len;dy/=len;
    player.dirX=dx;player.dirY=dy;
    player.x=clamp(player.x+dx*player.speed*dt,20,world.w-20);
    player.y=clamp(player.y+dy*player.speed*dt,20,world.h-200);
  }
}

function nearHome(){
  for(const p of people){
    const cx=p.home.x+p.home.w/2, cy=p.home.y+p.home.h/2;
    if(Math.hypot(player.x-cx,player.y-cy)<125) return p;
  }
  return null;
}

function updateWorld(dt){
  movePlayer(dt);
  const p=nearHome();
  if(p && pressed("e"," ")){
    openHome(p); return;
  }
  camera.x=clamp(player.x-W/2,0,world.w-W);
  camera.y=clamp(player.y-H/2,0,world.h-H);
  messageTimer=Math.max(0,messageTimer-dt);
}

function updateBossIntro(){
  if(pressed("e"," ")) {
    state="boss";
    player.x=180;player.y=350;player.hp=100;
    boss.hp=boss.maxHp;boss.x=880;boss.y=350;
  }
}

function shootPlayer(){
  if(player.attackCooldown>0) return;
  player.attackCooldown=.28;
  const dx=player.dirX||1,dy=player.dirY||0;
  projectiles.push({x:player.x+dx*20,y:player.y+dy*20,dx,dy,life:1});
  for(let i=0;i<5;i++) addParticle(player.x,player.y,"#93c5fd",.25,3);
}

function updateBoss(dt){
  let dx=(keys["arrowright"]||keys["d"]?1:0)-(keys["arrowleft"]||keys["a"]?1:0);
  let dy=(keys["arrowdown"]||keys["s"]?1:0)-(keys["arrowup"]||keys["w"]?1:0);
  if(dx||dy){
    const len=Math.hypot(dx,dy);dx/=len;dy/=len;
    player.dirX=dx;player.dirY=dy;
    player.x=clamp(player.x+dx*220*dt,25,W-25);
    player.y=clamp(player.y+dy*220*dt,150,H-65);
  }
  if(pressed("e"," ")) shootPlayer();
  player.attackCooldown=Math.max(0,player.attackCooldown-dt);
  player.invuln=Math.max(0,player.invuln-dt);

  // Boss follows, but keeps a little distance.
  const bdx=player.x-boss.x, bdy=player.y-boss.y, d=Math.hypot(bdx,bdy)||1;
  if(d>150){
    boss.x += bdx/d*boss.speed*dt;
    boss.y += bdy/d*boss.speed*dt;
  }

  boss.shootCooldown=Math.max(0,(boss.shootCooldown||0)-dt);
  if(boss.shootCooldown<=0){
    boss.shootCooldown=.85;
    const vx=bdx/d,vy=bdy/d;
    enemyProjectiles.push({x:boss.x,y:boss.y,dx:vx,dy:vy,life:4,speed:190});
  }

  projectiles.forEach(p=>{
    p.x+=p.dx*480*dt;p.y+=p.dy*480*dt;p.life-=dt;
    if(Math.hypot(p.x-boss.x,p.y-boss.y)<38){
      boss.hp-=8;p.life=-1;boss.hitFlash=.12;shake=.1;
      for(let i=0;i<8;i++)addParticle(boss.x,boss.y,"#fbbf24",.5,4);
    }
  });
  projectiles=projectiles.filter(p=>p.life>0);

  enemyProjectiles.forEach(p=>{
    p.x+=p.dx*p.speed*dt;p.y+=p.dy*p.speed*dt;p.life-=dt;
    if(p.life>0 && Math.hypot(p.x-player.x,p.y-player.y)<23 && player.invuln<=0){
      player.hp-=10;player.invuln=.65;p.life=-1;shake=.12;
      for(let i=0;i<7;i++)addParticle(player.x,player.y,"#fb7185",.4,4);
    }
  });
  enemyProjectiles=enemyProjectiles.filter(p=>p.life>0);

  if(Math.hypot(player.x-boss.x,player.y-boss.y)<60 && player.invuln<=0){
    player.hp-=18*dt; player.invuln=.08;
  }

  if(boss.hitFlash>0) boss.hitFlash-=dt;
  if(boss.hp<=0){
    state="victory";
  } else if(player.hp<=0){
    state="defeat";
  }
}

function updateParticles(dt){
  particles.forEach(p=>{
    p.life-=dt;p.x+=p.dx*dt;p.y+=p.dy*dt;p.dy+=80*dt;
  });
  particles=particles.filter(p=>p.life>0);
}

function drawParticles(){
  particles.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/p.max,0,1);
    ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x-camera.x,p.y-camera.y,p.size,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
  });
}

let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000); last=now;
  if(pressed("r") && (state==="victory"||state==="defeat")) resetGame();

  if(state==="world") updateWorld(dt);
  else if(state==="dialog"){
    if(pressed("e"," ")) closeDialog();
  }
  else if(state==="bossIntro") updateBossIntro();
  else if(state==="boss") updateBoss(dt);

  updateParticles(dt);

  if(state==="world"){
    drawWorld();
    drawParticles();
    drawHUD();
    const p=nearHome();
    if(p){
      roundedRect(W/2-170,H-125,340,42,10,"rgba(15,23,42,.9)");
      drawText(`E / SPACE: Enter ${p.name}'s home`,W/2,H-103,15,"#fff","center");
    }
  } else if(state==="dialog"){
    drawWorld();drawHUD();drawDialog();
  } else if(state==="bossIntro"){
    drawWorld();drawHUD();drawBossIntro();
  } else if(state==="boss"){
    drawBoss();drawParticles();
  } else if(state==="victory"){
    drawBoss();drawEnd(true);
  } else if(state==="defeat"){
    drawBoss();drawEnd(false);
  }

  justPressed.clear();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

})();
</script>
</body>
</html>
